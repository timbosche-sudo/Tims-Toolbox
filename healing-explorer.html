document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"margin:0;font-size:28px;font-weight:700;letter-spacing:-0.02em\">Three clinic models, same providers<\u002Fh2><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:14px;background:#FFFFFF;border:1px solid #D9D9D9;border-radius:4px;padding:10px 14px\"><span style=\"font-size:10px;letter-spacing:0.12em;color:#7A7C7B\">PROVIDERS<\u002Fspan><input type=\"range\" min=\"3\" max=\"20\" value=\"{{ cmpP }}\" sc-camel-on-change=\"{{ onCmpP }}\" style=\"width:200px;margin:0\"><span style=\"font-size:20px;font-weight:700;width:30px\">{{ cmpP }}<\u002Fspan><span style=\"font-size:12px;color:#7A7C7B\">in clinic<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:190px repeat(3,minmax(0,1fr));border-top:1px solid #000000\">\n      <div style=\"padding:14px 0;font-size:12px;color:#7A7C7B;line-height:1.45;padding-right:16px\">Qualitative scales show relative tendencies, not scores. Each model uses its own starting assumptions.<\u002Fdiv>\n      <sc-for list=\"{{ cmpCols }}\" as=\"c\" hint-placeholder-count=\"3\">\n        <div style=\"padding:14px 14px 16px;border-left:1px solid #E8E8E8;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"position:relative\">\n            <button sc-camel-on-click=\"{{ c.toggle }}\" style=\"width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:inherit;font-size:14px;font-weight:700;padding:8px 10px;border:1px solid #D9D9D9;border-radius:3px;background:#fff;color:#000000;cursor:pointer;text-align:left\" style-hover=\"border-color:#000000\"><span>{{ c.name }}<\u002Fspan><span style=\"font-size:9.5px;letter-spacing:0.1em;color:#3A7F8A;font-weight:400\">CHANGE<\u002Fspan><\u002Fbutton>\n            <sc-if value=\"{{ c.open }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"position:absolute;top:40px;left:0;right:0;z-index:30;background:#fff;border:1px solid #D9D9D9;border-radius:4px;box-shadow:0 12px 30px rgba(20,20,20,0.12);max-height:34 es for discussion. Values reflect each model’s starting assumptions at the selected provider count.<\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isPrio }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Priorities\" style=\"flex:1;min-height:0;display:grid;grid-template-columns:360px minmax(0,1fr)\">\n    <div style=\"border-right:1px solid #D9D9D9;background:#FFFFFF;overflow-y:auto;padding:26px 26px 32px;display:flex;flex-direction:column;gap:20px\">\n      <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:10px;letter-spacing:0.14em;color:#7A7C7B\">PRIORITIES<\u002Fspan><h2 style=\"margin:0;font-size:28px;font-weight:700;letter-spacing:-0.02em\">What matters most?<\u002Fh2><p style=\"margin:4px 0 0;font-size:13px;line-height:1.5;color:#4D4D4D\">Move each priority. Clinic models that align with the group’s priorities rise to the top.<\u002Fp><\u002Fdiv>\n      <sc-for list=\"{{ prioSliders }}\" as=\"p\" hint-placeholder-count=\"9\">\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-size:13.5px;font-weight:700\">{{ p.name }}<\u002Fspan><span style=\"font-size:10px;color:#3A7F8A;letter-spacing:0.06em;font-weight:700\">{{ p.read }}<\u002Fspan><\u002Fdiv>\n          <input type=\"range\" min=\"0\" max=\"100\" value=\"{{ p.v }}\" sc-camel-on-change=\"{{ p.on }}\" style=\"width:100%;margin:0\">\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"font-size:12px;line-height:1.5;color:#4D4D4D;padding:12px 13px;background:#F2F2F2;border-radius:4px\"><strong style=\"font-weight:700;color:#000000\">How alignment works.<\u002Fstrong> Each clinic model carries a conceptual profile across the nine priorities, derived from its starting configuration and shown as small bars. Alignment weights that profile by the importance you set. Nothing here is ranked as best.<\u002Fdiv>\n y-content:space-between;align-items:flex-end;gap:20px\"><div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:10px;letter-spacing:0.14em;color:#7A7C7B\">RESOURCES<\u002Fspan><h2 style=\"margin:0;font-size:28px;font-weight:700;letter-spacing:-0.02em\">Planning knowledge, in context<\u002Fh2><\u002Fdiv><span style=\"font-size:12px;color:#4D4D4D;max-width:420px;text-align:right;line-height:1.45\">Placeholder cards structured to link to SharePoint, BSA standards, benchmarks, PDFs, case studies, post-occupancy studies, research, and institutional standards.<\u002Fspan><\u002Fdiv>\n    <sc-for list=\"{{ resGroups }}\" as=\"g\" hint-placeholder-count=\"4\">\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <div style=\"display:flex;align-items:baseline;gap:10px;border-bottom:1px solid #D9D9D9;padding-bottom:8px\"><span style=\"font-size:15px;font-weight:700\">{{ g.name }}<\u002Fspan><span style=\"{{ g.tagSt }}\">{{ g.tag }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px\">\n          <sc-for list=\"{{ g.items }}\" as=\"r\" hint-placeholder-count=\"4\"><a href=\"{{ r.url }}\" sc-camel-on-click=\"{{ r.on }}\" style=\"display:flex;flex-direction:column;gap:8px;padding:12px 13px;border:1px solid #D9D9D9;border-radius:4px;background:#fff;color:#000000;text-decoration:none;min-height:74px\" style-hover=\"border-color:#3A7F8A\"><span style=\"font-size:9px;letter-spacing:0.1em;color:#7A7C7B\">{{ r.tag }}<\u002Fspan><span style=\"font-size:13px;font-weight:700;line-height:1.3\">{{ r.title }}<\u002Fspan><\u002Fa><\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"padding:14px 16px;background:#FFFFFF;border:1px solid #E8E8E8;border-radius:4px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:9.5px;letter-spacing:0.12em;color:#CC1B2D;font-weight:700\">CONCEPTUAL PLANNING GUIDANCE ONLY<\u002Fspan><span style=\"font-size:12.5px;line-height:1.5;color:#4D4D4D\">This tool is not a medical operations simulator, staffing calculator, clinical protocol tool, code-compliance checker, infection-control or FGI compliance tool, licensing or reimbursement model, life-safety analysis, or regulatory approval tool. Verify detailed planning against applicable codes, FGI Guidelines, accessibility requirements, infection prevention requirements, health system standards, operational data, clinical, engineering, and regulatory requirements.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isExport }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Export\" style=\"min-height:100vh;background:#EBEBEB;padding:28px 20px 48px;display:flex;flex-direction:column;align-items:center;gap:16px\">\n    <div data-noprint=\"1\" style=\"width:100%;max-width:1100px;display:flex;justify-content:space-between;align-items:center\"><button sc-camel-on-click=\"{{ goConfig }}\" style=\"padding:8px 12px;font-family:inherit;font-size:12.5px;background:transparent;border:1px solid #BFBFBF;border-radius:3px;cursor:pointer;color:#000000\">← Back to configurator<\u002Fbutton><div style=\"display:flex;gap:8px;align-items:center\"><span style=\"font-size:12px;color:#4D4D4D\">Print or save as PDF from your browser.<\u002Fspan><button sc-camel-on-click=\"{{ doPrint }}\" style=\"padding:8px 14px;font-family:inherit;font-size:12.5px;background:#000000;color:#fff;border:none;border-radius:3px;cursor:pointer\">Print / Save PDF<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n    <div style=\"width:100%;max-width:1100px;background:#fff;box-shadow:0 2px 20px rgba(0,0,0,0.06);padding:44px 48px 40px;display:flex;flex-direction:column;gap:24px;box-sizing:border-box\">\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #000000;padding-bottom:18px;gap:20px\">\n        <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-size:10px;letter-spacing:0.14em;color:#7A7C7B\">AMBULATORY CARE EXPLORER · PLANNING WORKSHOP SUMMARY<\u002Fspan><span style=\"font-size:30px;font-weight:700;letter-spacing:-0.02em;line-height:1.1\">{{ name }}<\u002Fspan><span style=\"font-size:14px;color:#4D4D4D\">{{ ex.sub }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:10.5px;color:#4D4D4D;letter-spacing:0.06em\"><span>{{ today }}<\u002Fspan><span>CONCEPTUAL PLANNING ESTIMATE<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-size:9.5px;letter-spacing:0.12em;font-weight:700;color:#3A7F8A\">CARE DELIVERY PROFILE<\u002Fspan><div style=\"display:flex;flex-wrap:wrap;gap:6px\"><sc-for list=\"{{ ex.tags }}\" as=\"t\" hint-placeholder-count=\"6\"><span style=\"font-size:12px;padding:5px 9px;border:1px solid #D9D9D9;border-radius:2px\">{{ t }}<\u002Fspan><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.35fr 1fr;gap:14px\">\n        <div style=\"height:360px;background:#F7F7F7\"><dc-import name=\"ClinicScene\" style=\"display:block;width:100%;height:100%\" scene=\"{{ exScene }}\" view=\"3d\" annotate=\"{{ true }}\" animate=\"{{ false }}\" hint-size=\"100%,360px\"><\u002Fdc-import><\u002Fdiv>\n        <div style=\"height:360px;background:#fff;border:1px solid #E8E8E8\"><dc-import name=\"ClinicScene\" style=\"display:block;width:100%;height:100%\" scene=\"{{ exScene }}\" view=\"plan\" annotate=\"{{ true }}\" animate=\"{{ false }}\" hint-size=\"100%,360px\"><\u002Fdc-import><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(8,1fr);border-top:1px solid #E8E8E8;border-bottom:1px solid #E8E8E8\">\n        <sc-for list=\"{{ metrics }}\" as=\"m\" hint-placeholder-count=\"8\"><div style=\"padding:12px 0;display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:9px;letter-spacing:0.12em;color:#7A7C7B\">{{ m.k }}<\u002Fspan><span style=\"font-size:16px;font-weight:700\">{{ m.v }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:0 28px\">\n        <sc-for list=\"{{ ex.fields }}\" as=\"f\" hint-placeholder-count=\"12\"><div style=\"display:flex;flex-direction:column;gap:3px;padding:9px 0;border-bottom:1px solid #EFEFEF\"><span style=\"font-size:9px;letter-spacing:0.12em;color:#7A7C7B\">{{ f.k }}<\u002Fspan><span style=\"font-size:13px;font-weight:700\">{{ f.v }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:28px;border-top:1px solid #E8E8E8;padding-top:18px\">\n        <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-size:9.5px;letter-spacing:0.12em;font-weight:700;color:#CC1B2D\">KEY TRADE-OFFS<\u002Fspan><sc-for list=\"{{ ex.tradeoffs }}\" as=\"t\" hint-placeholder-count=\"3\"><div style=\"font-size:12.5px;line-height:1.5\">{{ t }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-size:9.5px;letter-spacing:0.12em;font-weight:700;color:#000000\">DECISIONS<\u002Fspan><sc-if value=\"{{ ex.noDecs }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:12.5px;color:#7A7C7B\">No decisions captured yet.<\u002Fspan><\u002Fsc-if><sc-for list=\"{{ ex.decs }}\" as=\"d\" hint-placeholder-count=\"0\"><div style=\"display:grid;grid-template-columns:110px 1fr;gap:8px;font-size:12.5px;line-height:1.45\"><span style=\"{{ d.st }}\">{{ d.status }}<\u002Fspan><span>{{ d.text }}<span style=\"color:#4D4D4D\"> {{ d.note }}<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:28px;border-top:1px solid #E8E8E8;padding-top:18px\">\n        <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-size:9.5px;letter-spacing:0.12em;font-weight:700;color:#3A7F8A\">PLANNING CONSIDERATIONS<\u002Fspan><sc-for list=\"{{ ex.cons }}\" as=\"c\" hint-placeholder-count=\"3\"><div style=\"display:flex;flex-direction:column;gap:1px;font-size:12.5px;line-height:1.45\"><span style=\"font-weight:700\">{{ c.title }}<\u002Fspan><span style=\"color:#4D4D4D\">{{ c.text }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-size:9.5px;letter-spacing:0.12em;font-weight:700;color:#7A7C7B\">QUESTIONS REMAINING<\u002Fspan><sc-for list=\"{{ ex.questions }}\" as=\"q\" hint-placeholder-count=\"5\"><div style=\"font-size:12.5px;line-height:1.5;display:grid;grid-template-columns:14px 1fr\"><span style=\"color:#7A7C7B\">○<\u002Fspan><span>{{ q }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;border-top:1px solid #E8E8E8;padding-top:12px;font-size:10.5px;color:#7A7C7B;gap:20px\"><span style=\"line-height:1.5\">Conceptual planning guidance only. Verify against applicable codes, FGI Guidelines, accessibility, infection prevention, health system standards, and operational data.<\u002Fspan><span style=\"display:flex;align-items:center;gap:8px;letter-spacing:0.08em;white-space:nowrap\"><img src=\"b76cb845-3a68-49bd-9e3b-40a90eb4a387\" alt=\"BSA\" style=\"height:11px;width:auto;display:block\">HEALING PLANNING PLATFORM<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  C = { ink: '#000000', ink2: '#4D4D4D', ink3: '#7A7C7B', line: '#D9D9D9', line2: '#E8E8E8', teal: '#3A7F8A', tealSoft: '#DDEFF2', navy: '#2F496E', red: '#CC1B2D', paper: '#F2F2F2' };\n  state = { ready: false, screen: 'start', stage: 'on', cfg: null, name: 'Team-Based Multi-Specialty Clinic', nameEdited: false, view: '3d', topic: 'type', touched: {}, rightTab: 'guide', annotate: true, wiOpen: false, wi: null, prevCfg: null, to: null, toKind: 'exam', fac: null, tip: null, tipsShown: {}, libSel: 'multi', cmp: { types: ['traditional', 'pod', 'onoff'], P: 8, open: -1 }, prio: null, slots: {}, saveMenu: false, hist: [], wcIdx: -1, wcOpen: false, hl: null, hlKey: 0, level: 'beg', coachMore: false, thinkOpen: false, refOpen: false, ccOpen: false, why: null, decs: [], decDraft: '', decNote: '', decStatus: 'AGREED', testOn: false, flexIdx: 0, care: { step: 0, ans: { spec: 'multi', org: 'team', flow: 'onoff', people: ['Physicians', 'Advanced Practice Providers', 'Nurses', 'Medical Assistants', 'Care Coordinators'], fprios: ['Privacy', 'Direct rooming'], support: 70, sfns: ['Medication', 'Clean supply', 'Soiled holding', 'Equipment', 'Storage'], adapt: 'specmix' }, done: false }, pod: { prov: 4, exam: 9, team: 7, consult: 1, proc: 0, med: true, supply: true, tw: 'M', support: 'pod', n: 2 }, podView: '3d', rel: {}, flowView: 'patient', qChecks: {}, startStep: 0 };\n  componentDidMount() { this.poll = setInterval(() => { const A = window.ACC; if (A && A.build && A.RULES && A.KEY_TOPIC && window.ACC_UI) { clearInterval(this.poll); this.init(); } }, 40); }\n  componentWillUnmount() { clearInterval(this.poll); clearInterval(this.startTimer); clearTimeout(this.tipTimer); clearTimeout(this.wcT); }\n  init() {\n    const A = window.ACC;\n    let slots = null, cur = null;\n    try { slots = JSON.parse(localStorage.getItem('acc-slots-v1') || 'null'); } catch (e) {}\n    try { cur = JSON.parse(localStorage.getItem('acc-current-v1') || 'null'); } catch (e) {}\n    if (!slots) slots = this.seedSlots();\n    const ok = cur && cur.cfg && A.TYPE[cur.cfg.typeId];\n    this.setState({ ready: true, cfg: ok ? cur.cfg : A.demoConfig(), name: (ok && cur.name) || 'Team-Based Multi-Specialty Clinic', nameEdited: !!(ok && cur.nameEdited), stage: (cur && cur.stage) || 'on', decs: (ok && Array.isArray(cur.decs)) ? cur.decs : [], rel: (cur && cur.rel) || {}, slots, prio: A.PRIOS.map((p) => p.def) });\n    this.startTimer = setInterval(() => { if (this.state.screen === 'start') this.setState((s) => ({ startStep: (s.startStep + 1) % 4 })); }, 3600);\n  }\n  seedSlots() {\n    const A = window.ACC, mk = (id, name) => { const c = Object.assign(A.defaultConfig(id), { P: 8, V: 160 }); c.E = Math.round(8 * A.TYPES.find((t) => t.id === id).rpp); return { cfg: c, name, decs: [] }; };\n    const s = { A: mk('traditional', 'Traditional Provider-Based Clinic'), B: mk('pod', 'Team-Based Pod Clinic'), C: mk('onoff', 'On-Stage / Off-Stage Clinic') };\n    s.B.cfg.care = 'team';\n    try { localStorage.setItem('acc-slots-v1', JSON.stringify(s)); } catch (e) {}\n    return s;\n  }\n  componentDidUpdate() {\n    const s = this.state;\n    if (s.ready && (s.cfg !== this._pCfg || s.name !== this._pName || s.stage !== this._pStage || s.decs !== this._pDecs || s.rel !== this._pRel)) {\n      this._pCfg = s.cfg; this._pName = s.name; this._pStage = s.stage; this._pDecs = s.decs; this._pRel = s.rel;\n      try { localStorage.setItem('acc-current-v1', JSON.stringify({ cfg: s.cfg, name: s.name, nameEdited: s.nameEdited, stage: s.stage, decs: s.decs, rel: s.rel })); } catch (e) {}\n    }\n  }\n  build(cfg, compact) {\n    const k = JSON.stringify(cfg) + (compact ? '|c' : '');\n    this._bc = this._bc || {};\n    if (!this._bc[k]) { if (Object.keys(this._bc).length > 160) this._bc = {}; this._bc[k] = window.ACC.build(cfg, { compact }); }\n    return this._bc[k];\n  }\n  autoName(cfg) {\n    const A = window.ACC, t = A.TYPE[cfg.typeId], care = A.CAREM[cfg.care];\n    if (t.name.indexOf(care.short) >= 0 || t.id === 'traditional' || t.id === 'team' || t.id === 'pod') return t.name;\n    return care.short + ' ' + t.name + (/Clinic|Care/.test(t.name) ? '' : ' Clinic');\n  }\n  record(prevCfg, cfg, key, s) {\n    const A = window.ACC;\n    if (!key || JSON.stringify(prevCfg) === JSON.stringify(cfg)) return {};\n    const hist = s.hist.slice(); const last = hist[hist.length - 1]; const now = Date.now();\n    let from = prevCfg;\n    if (last && last.key === key && now - last.t < 2000) { from = last.prevCfg; hist.pop(); }\n    const a = this.build(from), b = this.build(cfg);\n    const wc = A.whatChanged(key, a, b);\n    if (wc.prev === wc.cur && !wc.facts.length) return {};\n    hist.push({ key, prevCfg: from, cfg, wc, t: now });\n    while (hist.length > 8) hist.shift();\n    clearTimeout(this.wcT); this.wcT = setTimeout(() => this.setState({ wcOpen: false }), 9000);\n    return { hist, wcIdx: hist.length - 1, wcOpen: true, hl: wc.hl, hlKey: s.hlKey + 1 };\n  }\n  undo() {\n    const s = this.state; if (!s.hist.length) return;\n    const hist = s.hist.slice(); const last = hist.pop();\n    this.setState({ cfg: last.prevCfg, hist, wcIdx: hist.length - 1, wcOpen: false, name: s.nameEdited ? s.name : this.autoName(last.prevCfg), wi: null, to: null });\n  }\n  set(patch, key) {\n    const A = window.ACC;\n    this.setState((s) => {\n      const cfg = Object.assign({}, s.cfg, patch);\n      const topic = A.KEY_TOPIC[key] || s.topic;\n      const touched = Object.assign({}, s.touched, { [topic]: true });\n      return Object.assign({ cfg, touched, topic, name: s.nameEdited ? s.name : this.autoName(cfg), to: null, wi: null }, this.record(s.cfg, cfg, key, s));\n    }, () => this.maybeTip(key));\n  }\n  maybeTip(key) {\n    if (this.state.stage !== 'off' || !key) return;\n    const c = this.state.cfg, t = this.state.touched;\n    let id = null;\n    if ((key === 'E' || key === 'rpp') && !t.care && !t.flow) id = 'roomsFirst';\n    else if (key === 'rpp') id = 'ratio';\n    else if (key === 'support' && c.support >= 67) id = 'shared';\n    else if (key === 'sep' && c.sep >= 67) id = 'separate';\n    else if (key === 'proc' && c.proc >= 60) id = 'proc';\n    else if (key === 'staffWork' && c.staffWork === 'private') id = 'private';\n    if (!id || this.state.tipsShown[id]) return;\n    this.setState((s) => ({ tip: { id, text: window.ACC.TIPS[id] }, tipsShown: Object.assign({}, s.tipsShown, { [id]: 1 }) }));\n    clearTimeout(this.tipTimer); this.tipTimer = setTimeout(() => this.setState({ tip: null }), 11000);\n  }\n  setType(id, extra) {\n    const A = window.ACC;\n    const cfg = Object.assign(A.defaultConfig(id), extra || {});\n    this.setState((s) => Object.assign({ cfg, screen: 'config', topic: 'type', touched: Object.assign({}, s.touched, { type: true }), name: s.nameEdited ? s.name : this.autoName(cfg), to: null, wi: null, fac: null }, this.record(s.cfg, cfg, 'typeId', s)));\n  }\n  runWhatIf(id) {\n    const A = window.ACC;\n    const baseCfg = this.state.wi ? this.state.prevCfg : this.state.cfg;\n    const before = this.build(baseCfg);\n    const r = A.whatIf(id, baseCfg, before.m);\n    const after = this.build(r.config);\n    const sum = A.whatIfSummary(id, before, after);\n    this.setState((s) => ({ prevCfg: s.wi ? s.prevCfg : s.cfg, cfg: r.config, wi: Object.assign({ id }, sum), wiOpen: false, hl: null, hlKey: s.hlKey + 1, view: r.view || s.view, to: null, testOn: false, topic: r.topic, name: s.nameEdited ? s.name : this.autoName(r.config) }));\n  }\n  facAnswer(o) {\n    const A = window.ACC, st = this.state, v = o.v;\n    let cfg = Object.assign({}, st.cfg);\n    const q = A.FAC[st.fac.step];\n    if (v.typeId) { const keepP = cfg.P; cfg = A.defaultConfig(v.typeId); if (st.fac.step > 0) { cfg.P = keepP; } }\n    else if (v.lean) {\n      const rpp = v.lean === 'cap' ? 3.0 : v.lean === 'bal' ? 2.5 : 2.0;\n      cfg.E = Math.max(2, Math.round(cfg.P * rpp)); if (v.lean === 'util') { cfg.support = Math.min(100, cfg.support + 20); cfg.tsBoost = 1.2; cfg.std = Math.min(100, cfg.std + 10); } else cfg.tsBoost = 1;\n    } else {\n      Object.assign(cfg, v);\n      if (v.P) { const rpp = st.cfg.E / st.cfg.P; cfg.E = Math.max(2, Math.round(v.P * rpp)); cfg.V = Math.round(v.P * (A.SPEC[cfg.spec] || A.SPEC.mixed).volPer); }\n      if (v.flow) cfg.sep = A.FLOWM[v.flow].sep;\n    }\n    this.setState((s) => ({ cfg, fac: { step: st.fac.step + 1 }, topic: q.k, touched: Object.assign({}, s.touched, { [q.k]: true }), name: s.nameEdited ? s.name : this.autoName(cfg) }));\n  }\n  writeSlots(slots) { try { localStorage.setItem('acc-slots-v1', JSON.stringify(slots)); } catch (e) {} this.setState({ slots }); }\n  saveSlot(id) { const slots = Object.assign({}, this.state.slots, { [id]: { cfg: this.state.cfg, name: this.state.name, decs: this.state.decs } }); this.writeSlots(slots); this.setState({ saveMenu: false }); }\n  loadSlot(id) { const sl = this.state.slots[id]; if (!sl) return; this.setState((s) => Object.assign({ cfg: sl.cfg, name: sl.name, nameEdited: true, decs: sl.decs || [], screen: 'config', saveMenu: false, wi: null, to: null }, this.record(s.cfg, sl.cfg, 'typeId', s))); }\n  dupInto(src) { const ids = ['A', 'B', 'C'], free = ids.find((i) => !this.state.slots[i]); if (!free) return false; const slots = Object.assign({}, this.state.slots, { [free]: JSON.parse(JSON.stringify(Object.assign({}, src, { name: src.name + ' (copy)' }))) }); this.writeSlots(slots); return true; }\n\n  segSt(on, extra) { const C = this.C; return Object.assign({ flex: 1, padding: '6px 4px', fontSize: 11.5, border: 'none', borderRadius: 3, background: on ? '#fff' : 'transparent', color: on ? C.ink : C.ink2, boxShadow: on ? '0 1px 2px rgba(0,0,0,0.08)' : 'none', cursor: 'pointer', fontFamily: 'inherit', fontWeight: on ? 700 : 400, whiteSpace: 'nowrap' }, extra || {}); }\n  chip(level) { const strong = level.indexOf('STRONG') === 0 || level === 'SUPPORTED', mod = level.indexOf('MODERATE') === 0 || level.indexOf('POSSIBLE') === 0; return { fontSize: 9.5, letterSpacing: '0.1em', fontWeight: 700, padding: '4px 7px', borderRadius: 2, alignSelf: 'flex-start', background: strong ? this.C.teal : mod ? this.C.tealSoft : '#EDEDED', color: strong ? '#fff' : mod ? this.C.teal : this.C.ink3, whiteSpace: 'nowrap' }; }\n  optSt(on, extra) { const C = this.C; return Object.assign({ textAlign: 'left', padding: '12px 14px', background: on ? C.ink : '#fff', color: on ? '#fff' : C.ink, border: '1px solid ' + (on ? C.ink : C.line), borderRadius: 4, cursor: 'pointer', fontFamily: 'inherit', fontSize: 13.5, display: 'flex', flexDirection: 'column', gap: 4 }, extra || {}); }\n  pillSt(on) { const C = this.C; return { padding: '7px 11px', fontSize: 12, fontFamily: 'inherit', borderRadius: 20, border: '1px solid ' + (on ? C.teal : C.line), background: on ? C.tealSoft : '#fff', color: on ? C.ink : C.ink2, cursor: 'pointer', fontWeight: on ? 700 : 400 }; }\n\n  renderVals() {\n    const A = window.ACC, st = this.state, C = this.C;\n    if (window.ACC_UI && !this.configVals) Object.assign(Object.getPrototypeOf(this), window.ACC_UI);\n    if (!st.ready || !A || !A.build || !this.configVals) return { isStart: true, modeBtns: [], startDots: [], stageBlurb: '', startLabel: '', startSub: '' };\n    return this.allVals();\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
