document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

=\"font-size:15px;font-weight:700\">{{ r.name }}<\u002Fspan><sc-for list=\"{{ r.items }}\" as=\"i\" hint-placeholder-count=\"3\"><a href=\"#\" style=\"display:flex;justify-content:space-between;gap:10px;padding-top:8px;border-top:1px solid #EFEFEF;color:#000000\"><span style=\"font-size:12.5px\">{{ i.t }}<\u002Fspan><span style=\"font-size:9.5px;letter-spacing:0.1em;color:#3A7F8A;white-space:nowrap\">{{ i.k }}<\u002Fspan><\u002Fa><\u002Fsc-for><\u002Fdiv><\u002Fsc-for>\n    <\u002Fdiv>\n    <span style=\"font-size:10.5px;letter-spacing:0.14em;color:#7A7C7B;padding-top:8px\">MORE PLANNING RESOURCES<\u002Fspan>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px\">\n      <sc-for list=\"{{ allRes }}\" as=\"r\" hint-placeholder-count=\"4\"><div style=\"background:#F7F7F7;border-radius:4px;padding:16px 18px;display:flex;flex-direction:column;gap:8px\"><span style=\"font-size:13.5px;font-weight:700\">{{ r.name }}<\u002Fspan><sc-for list=\"{{ r.items }}\" as=\"i\" hint-placeholder-count=\"3\"><a href=\"#\" style=\"font-size:12.5px;color:#4D4D4D\">{{ i.t }}<\u002Fa><\u002Fsc-for><\u002Fdiv><\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:6px\"><span style=\"font-size:11.5px;color:#7A7C7B\">Structured for future sources:<\u002Fspan><sc-for list=\"{{ resTypes }}\" as=\"t\" hint-placeholder-count=\"6\"><span style=\"font-size:11.5px;padding:4px 9px;border:1px solid #D9D9D9;border-radius:3px;color:#4D4D4D\">{{ t }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isExport }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Export\" data-print-page=\"1\" style=\"flex:1;min-height:0;overflow-y:auto;background:#E3E3E3;padding:28px 0 48px\">\n    <div data-noprint=\"1\" style=\"max-width:1040px;margin:0 auto 14px;display:flex;justify-content:space-between;align-items:center;padding:0 4px\"><span style=\"font-size:12px;color:#4D4D4D\">Presentation-ready workshop summary. Print or save as PDF from the browser.<\u002Fspan><button sc-camel-on-click=\"{{ doPrint }}\" style=\"padding:9px 16px;font-family:inherit;font-size:12px;font-weight:700;background:#000000;color:#FFFFFF;border:none;border-radius:3px;cursor:pointer\">Print / Save PDF<\u002Fbutton><\u002Fdiv>\n    <div style=\"max-width:1040px;margin:0 auto;background:#FFFFFF;padding:44px 52px 40px;display:flex;flex-direction:column;gap:28px;box-shadow:0 2px 12px rgba(0,0,0,0.06)\">\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000000;padding-bottom:18px;gap:20px\">\n        <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-size:10.5px;letter-spacing:0.16em;color:#CC1B2D;font-weight:700\">DISCOVERY SPACE EXPLORER<\u002Fspan><span style=\"font-size:34px;font-weight:600;letter-spacing:-0.025em;line-height:1.05\">{{ name }}<\u002Fspan><div style=\"display:flex;flex-wrap:wrap;gap:4px 14px\"><sc-for list=\"{{ exTags }}\" as=\"t\" hint-placeholder-count=\"5\"><span style=\"font-size:13px;color:#4D4D4D\">{{ t }}<\u002Fspan><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:10px\"><img src=\"d64c77f8-f234-4302-b178-4b869f8c6371\" alt=\"BSA\" style=\"height:20px;width:auto\"><span style=\"font-size:11px;color:#7A7C7B\">{{ exDate }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.25fr 1fr;gap:16px\">\n        <div style=\"height:340px;background:#F7F7F7;position:relative\"><span style=\"position:absolute;left:12px;top:10px;font-size:9.5px;letter-spacing:0.12em;color:#7A7C7B;z-index:2\">3D VIEW<\u002Fspan><dc-import name=\"LabScene\" style=\"display:block;width:100%;height:100%\" scene=\"{{ exScene }}\" view=\"3d\" annotate=\"{{ true }}\" animate=\"{{ false }}\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fdiv>\n        <div style=\"height:340px;background:#FFFFFF;border:1px solid #E8E8E8;position:relative\"><span style=\"position:absolute;left:12px;top:10px;font-size:9.5px;letter-spacing:0.12em;color:#7A7C7B;z-index:2\">PLAN<\u002Fspan><dc-import name=\"LabScene\" style=\"display:block;width:100%;height:100%\" scene=\"{{ exScene }}\" view=\"plan\" animate=\"{{ false }}\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:28px\">\n        <div style=\"display:flex;flex-direction:column\"><span style=\"font-size:10px;letter-spacing:0.14em;font-weight:700;padding-bottom:8px\">RESEARCH PROFILE + STRATEGY<\u002Fspan><sc-for list=\"{{ exRows }}\" as=\"r\" hint-placeholder-count=\"9\"><div style=\"display:grid;grid-template-columns:140px 1fr;gap:12px;padding:8px 0;border-top:1px solid #EFEFEF\"><span style=\"font-size:10px;letter-spacing:0.1em;color:#7A7C7B;text-transform:uppercase;padding-top:2px\">{{ r.k }}<\u002Fspan><span style=\"font-size:12.5px;line-height:1.4\">{{ r.v }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:20px\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-size:10px;letter-spacing:0.14em;font-weight:700\">KEY TRADE-OFFS<\u002Fspan><sc-for list=\"{{ exTrade }}\" as=\"t\" hint-placeholder-count=\"3\"><span style=\"font-size:12.5px;line-height:1.45\">· {{ t }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"display:flex;gap:8px;align-items:center\"><span style=\"font-size:10px;letter-spacing:0.14em;font-weight:700\">CONFIGURATION CHECK<\u002Fspan><span style=\"{{ exCheckSt }}\">{{ exCheck }}<\u002Fspan><\u002Fdiv><sc-for list=\"{{ exCheckItems }}\" as=\"t\" hint-placeholder-count=\"0\"><span style=\"font-size:12.5px\">· {{ t }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:7px\"><span style=\"font-size:10px;letter-spacing:0.14em;font-weight:700\">TEST THIS LAB<\u002Fspan><sc-for list=\"{{ exTests }}\" as=\"t\" hint-placeholder-count=\"6\"><div style=\"display:flex;justify-content:space-between;gap:10px;align-items:center\"><span style=\"font-size:12.5px\">{{ t.name }}<\u002Fspan><span style=\"{{ t.st }}\">{{ t.lvl }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;border-top:1px solid #D9D9D9;padding-top:20px\">\n        <div style=\"display:flex;flex-direction:column;gap:9px\"><span style=\"font-size:10px;letter-spacing:0.14em;font-weight:700\">DECISIONS<\u002Fspan><sc-for list=\"{{ exDecisions }}\" as=\"d\" hint-placeholder-count=\"3\"><div style=\"display:flex;flex-direction:column;gap:4px;align-items:flex-start\"><span style=\"{{ d.st }}\">{{ d.s }}<\u002Fspan><span style=\"font-size:12.5px;line-height:1.4\">{{ d.t }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><sc-if value=\"{{ exNoDec }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:12px;color:#7A7C7B\">No decisions captured.<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px\"><span style=\"font-size:10px;letter-spacing:0.14em;font-weight:700\">QUESTIONS REMAINING<\u002Fspan><sc-for list=\"{{ exQs }}\" as=\"q\" hint-placeholder-count=\"5\"><span style=\"font-size:12.5px;line-height:1.4\">☐ {{ q }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font-size:10px;letter-spacing:0.14em;font-weight:700\">PLANNING CONSIDERATIONS<\u002Fspan><sc-for list=\"{{ exConsider }}\" as=\"c\" hint-placeholder-count=\"3\"><div style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"{{ c.st }}\">{{ c.label }}<\u002Fspan><span style=\"font-size:12px;line-height:1.4\">{{ c.t }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:28px;border-top:1px solid #D9D9D9;padding-top:20px\">\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:10px;letter-spacing:0.14em;font-weight:700;color:#3A7F8A\">RELATIONSHIPS · STRONG<\u002Fspan><sc-for list=\"{{ exRelStrong }}\" as=\"t\" hint-placeholder-count=\"4\"><span style=\"font-size:12.5px\">{{ t }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:10px;letter-spacing:0.14em;font-weight:700;color:#CC1B2D\">RELATIONSHIPS · SEPARATE<\u002Fspan><sc-for list=\"{{ exRelSep }}\" as=\"t\" hint-placeholder-count=\"2\"><span style=\"font-size:12.5px\">{{ t }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:10.5px;color:#7A7C7B;line-height:1.5;border-top:1px solid #D9D9D9;padding-top:14px\">Conceptual planning and decision-making support only. This is not a code compliance, biosafety, chemical safety, engineering design, or regulatory review. Detailed design must be verified by architects, engineers, safety professionals, EH&amp;S specialists, institutional standards, and regulatory requirements.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ facilOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-noprint=\"1\" style=\"position:fixed;inset:0;background:rgba(20,20,20,0.35);z-index:50;display:flex;align-items:center;justify-content:center\">\n      <div style=\"width:640px;background:#FFFFFF;border-radius:6px;padding:32px 36px 28px;display:flex;flex-direction:column;gap:22px;box-shadow:0 24px 64px rgba(0,0,0,0.2);animation:dscFade .2s ease\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center\"><span style=\"font-size:10.5px;letter-spacing:0.14em;color:#3A7F8A;font-weight:700\">FACILITATE · {{ facilN }}<\u002Fspan><button sc-camel-on-click=\"{{ facilClose }}\" style=\"background:none;border:none;cursor:pointer;font-size:18px;color:#7A7C7B;padding:0\">×<\u002Fbutton><\u002Fdiv>\n        <div style=\"display:flex;gap:4px\"><sc-for list=\"{{ facilDots }}\" as=\"d\" hint-placeholder-count=\"9\"><div style=\"{{ d.st }}\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n        <h2 style=\"margin:0;font-size:30px;line-height:1.15;font-weight:600;letter-spacing:-0.02em\">{{ facilQ }}<\u002Fh2>\n        <div style=\"display:flex;flex-direction:column;gap:8px\"><sc-for list=\"{{ facilOpts }}\" as=\"o\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ o.on }}\" style=\"text-align:left;padding:14px 16px;font-family:inherit;font-size:15px;background:#FFFFFF;border:1px solid #D9D9D9;border-radius:4px;cursor:pointer;color:#000000\" style-hover=\"border-color:#000000;background:#F7F7F7\">{{ o.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:center\"><button sc-camel-on-click=\"{{ facilBack }}\" style=\"background:none;border:none;cursor:pointer;font-family:inherit;font-size:12px;color:#4D4D4D;padding:0\">← Previous<\u002Fbutton><span style=\"font-size:11.5px;color:#7A7C7B\">Each answer updates the lab and is captured as a decision.<\u002Fspan><button sc-camel-on-click=\"{{ facilSkip }}\" style=\"background:none;border:none;cursor:pointer;font-family:inherit;font-size:12px;color:#4D4D4D;padding:0\">Skip →<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-noprint=\"1\" style=\"position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000000;color:#FFFFFF;padding:10px 16px;border-radius:4px;font-size:12.5px;z-index:60;animation:dscFade .2s ease\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { ready: false, screen: 'start', tab: 'configure', mode: 'on', level: 'beginner', view: '3d', annotate: true, cfg: null, name: '', hist: [], lastK: null, densFrom: null, topic: 'research', changed: null, wi: null, flexF: 'current', flexPlay: false, decisions: [], dText: '', dStatus: 'AGREED', facil: null, slots: null, saved: [], pr: { capacity: 70, adapt: 80, collab: 60, equipAccess: 60, shared: 50, infraFlex: 70, safety: 60, growth: 50 }, relOv: {}, eco: 'molbio', libSel: 'biomed', rs: { step: 0, discover: [], work: [], time: { bench: 40, equip: 20, comp: 20, collab: 10, support: 10 }, support: [], connect: null, share: 50, adapt: null }, think: false, testOpen: true, saveMenu: false, toast: '', startIdx: 0 };\n  cache = {};\n  componentDidMount() {\n    this.poll = setInterval(() => { const D = window.DSC; if (D && D.build && D.coach && D.project && D.UI && D.UI.configure && D.UI.exportV) { clearInterval(this.poll); this.init(); } }, 40);\n    this.si = setInterval(() => { if (this.state.screen === 'start') this.setState((s) => ({ startIdx: (s.startIdx + 1) % 4 })); }, 3000);\n  }\n  componentWillUnmount() { clearInterval(this.poll); clearInterval(this.si); clearInterval(this.fp); clearTimeout(this.tt); clearTimeout(this.pt); }\n  componentDidUpdate() { if (this.state.ready) this.persist(); }\n  defaultDecisions() { return [{ s: 'AGREED', t: 'Major centrifuges will be shared.' }, { s: 'EXPLORE', t: 'Test whether tissue culture can support two research groups.' }, { s: 'OPEN QUESTION', t: 'Confirm specialty gas requirements.' }]; }\n  defaultSlots() { const D = window.DSC; const o = {}; ['A', 'B', 'C'].forEach((id, i) => (o[id] = { name: D.PRESETS[i].name, cfg: D.PRESETS[i].cfg(), decisions: [] })); return o; }\n  init() {\n    const D = window.DSC; let s = {}, saved = [];\n    try { s = JSON.parse(localStorage.getItem('dsc.session') || '{}'); } catch (e) {}\n    try { saved = JSON.parse(localStorage.getItem('dsc.saved') || '[]'); } catch (e) {}\n    const okCfg = (c) => c && D.TYPE[c.typeId];\n    const slots = s.slots && ['A', 'B', 'C'].every((k) => s.slots[k] && okCfg(s.slots[k].cfg)) ? s.slots : this.defaultSlots();\n    this.setState({ ready: true, cfg: okCfg(s.cfg) ? s.cfg : D.demoConfig(), name: s.name || D.DEMO_NAME, decisions: s.decisions || this.defaultDecisions(), mode: s.mode || 'on', level: s.level || 'beginner', pr: s.pr || this.state.pr, relOv: s.relOv || {}, slots, saved: saved.filter((x) => okCfg(x.cfg)) });\n  }\n  persist() {\n    clearTimeout(this.pt);\n    this.pt = setTimeout(() => { const s = this.state; try { localStorage.setItem('dsc.session', JSON.stringify({ cfg: s.cfg, name: s.name, decisions: s.decisions, mode: s.mode, level: s.level, pr: s.pr, relOv: s.relOv, slots: s.slots })); localStorage.setItem('dsc.saved', JSON.stringify(s.saved)); } catch (e) {} }, 300);\n  }\n  build(cfg) {\n    const k = JSON.stringify(cfg);\n    if (!this.cache[k]) { const keys = Object.keys(this.cache); if (keys.length > 80) this.cache = {}; this.cache[k] = window.DSC.build(cfg); }\n    return this.cache[k];\n  }\n  toast(msg) { clearTimeout(this.tt); this.setState({ toast: msg }); this.tt = setTimeout(() => this.setState({ toast: '' }), 2200); }\n  setCfg(patch, topic, opts) {\n    opts = opts || {};\n    const s = this.state, cfg = Object.assign({}, s.cfg, patch);\n    const keys = Object.keys(patch).filter((k) => patch[k] !== s.cfg[k]);\n    if (!keys.length) return;\n    const k = opts.k || keys[0];\n    const now = Date.now(), same = s.lastK === k && now - (this.lastT || 0) < 1500;\n    this.lastT = now;\n    let changed;\n    if (opts.label) changed = { k: 'multi', label: opts.label };\n    else if (same && s.changed && s.changed.k === k) changed = { k, a: s.changed.a, b: cfg[k] };\n    else changed = { k, a: s.cfg[k], b: cfg[k] };\n    this.setState({ cfg, hist: same ? s.hist : s.hist.concat([s.cfg]).slice(-50), lastK: k, densFrom: k === 'bench' ? (same && s.densFrom ? s.densFrom : s.cfg) : null, changed, topic: topic || window.DSC.UI.TOPIC_OF[k] || s.topic, wi: opts.keepWi ? s.wi : null });\n  }\n  why(topic, noScroll) { this.setState({ topic }); }\n  undo() { const s = this.state; if (!s.hist.length) return; this.setState({ cfg: s.hist[s.hist.length - 1], hist: s.hist.slice(0, -1), changed: null, lastK: null, wi: null }); this.toast('Last change undone'); }\n  reset() { const D = window.DSC; const s = this.state; this.setState({ cfg: D.demoConfig(), name: D.DEMO_NAME, hist: s.hist.concat([s.cfg]).slice(-50), changed: null, wi: null, view: '3d', flexF: 'current' }); this.toast('Reset to the sample starting scenario'); }\n  keepWhatIf(cfg, q) { this.setCfg(cfg, null, { label: 'Kept: ' + q }); this.toast('Changes kept. Undo is available.'); }\n  toggleFlexPlay() {\n    const s = this.state; clearInterval(this.fp);\n    if (s.flexPlay) { this.setState({ flexPlay: false }); return; }\n    const ids = window.DSC.FLEXF.map((f) => f.id);\n    this.setState({ flexPlay: true });\n    this.fp = setInterval(() => { if (!this.state.flexPlay || this.state.view !== 'flex') { clearInterval(this.fp); this.setState({ flexPlay: false }); return; } this.setState((st) => ({ flexF: ids[(ids.indexOf(st.flexF) + 1) % ids.length] })); }, 2400);\n  }\n  addDecision() { const s = this.state; const t = (s.dText || '').trim(); if (!t) return; this.setState({ decisions: s.decisions.concat([{ s: s.dStatus, t }]), dText: '' }); }\n  facilAnswer(q, label, patch) {\n    const s = this.state, D = window.DSC;\n    let p = Object.assign({}, patch);\n    if (p.typeId) { const base = D.defaultConfig(p.typeId); p = Object.assign(base, { team: s.cfg.team }); }\n    this.setCfg(p, null, { label: 'Facilitation: ' + q.key.toLowerCase() + ' set to \\u201C' + label + '\\u201D' });\n    this.setState((st) => ({ decisions: st.decisions.concat([{ s: 'AGREED', t: q.key + ': ' + label + '.' }]) }));\n    this.facilNext();\n  }\n  facilNext() { const s = this.state; const i = s.facil.i + 1; if (i >= window.DSC.FACIL.length) { this.setState({ facil: null }); this.toast('Facilitation complete. Answers captured as decisions.'); } else this.setState({ facil: { i } }); }\n  setRs(patch) { this.setState((s) => ({ rs: Object.assign({}, s.rs, patch) })); }\n  applyProfile(p, typeId) { const D = window.DSC; const cfg = D.configFromProfile(p, typeId, this.state.rs); const s = this.state; this.setState({ cfg, name: D.TYPE[typeId].name + ' \\u2014 Research Profile', hist: s.cfg ? s.hist.concat([s.cfg]) : [], screen: 'app', tab: 'configure', changed: { k: 'multi', label: 'Configured from your research profile.' }, topic: 'research', view: '3d' }); }\n  useType(id) { const D = window.DSC; const s = this.state; const c = Object.assign(D.defaultConfig(id), { team: Math.max(D.TYPE[id].team[0], Math.min(D.TYPE[id].team[2], s.cfg.team)) }); this.setCfg(c, 'type', { k: 'typeId' }); this.setState({ tab: 'configure', name: D.TYPE[id].name }); }\n  saveSlot(id) { const s = this.state; const slots = Object.assign({}, s.slots, { [id]: { name: s.name, cfg: s.cfg, decisions: s.decisions.slice() } }); this.setState({ slots, saveMenu: false }); this.toast('Saved to Option ' + id); }\n  loadSlot(id) { const s = this.state, sl = s.slots[id]; this.setState({ cfg: sl.cfg, name: sl.name, decisions: sl.decisions.slice(), hist: s.hist.concat([s.cfg]).slice(-50), tab: 'configure', changed: null, wi: null }); this.toast('Loaded Option ' + id); }\n  saveLibrary() { const s = this.state; this.setState({ saved: [{ name: s.name, cfg: s.cfg, decisions: s.decisions.slice(), ts: Date.now() }].concat(s.saved), saveMenu: false }); this.toast('Saved to scenario library'); }\n  loadSaved(i) { const s = this.state, it = s.saved[i]; this.setState({ cfg: it.cfg, name: it.name, decisions: (it.decisions || []).slice(), hist: s.hist.concat([s.cfg]).slice(-50), tab: 'configure', changed: null, wi: null }); this.toast('Loaded \\u201C' + it.name + '\\u201D'); }\n  dupSaved(i) { const s = this.state, it = s.saved[i]; const saved = s.saved. ct.assign(v, D.UI.resources(this));\n    if (v.isExport) Object.assign(v, D.UI.exportV(this));\n    v.curScene = this.sc; v.type = this.sc.t;\n    return v;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
