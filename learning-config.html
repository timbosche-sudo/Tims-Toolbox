  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <button sc-camel-on-click=\"{{ openSimRoom }}\" style=\"padding:10px;font-family:inherit;font-size:12.5px;background:transparent;border:1px solid #D9D9D9;border-radius:3px;cursor:pointer;color:#000000\" style-hover=\"border-color:#000000\">Configure a simulation room<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"position:relative;background:#ECECEC;min-width:0\">\n      <div style=\"position:absolute;inset:24px 24px 70px;display:flex;align-items:center;justify-content:center\">\n        <div style=\"position:relative;width:min(100%, calc((100vh - 200px) * 1.5));aspect-ratio:3 / 2\">\n          <svg sc-camel-view-box=\"0 0 900 600\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position:absolute;inset:0;width:100%;height:100%\">\n            <sc-for list=\"{{ nurseLinks }}\" as=\"l\" hint-placeholder-count=\"0\"><g opacity=\"{{ l.o }}\"><line x1=\"{{ l.x1 }}\" y1=\"{{ l.y1 }}\" x2=\"{{ l.x2 }}\" y2=\"{{ l.y2 }}\" stroke=\"{{ l.c }}\" sc-camel-stroke-width=\"{{ l.w }}\" sc-camel-stroke-dasharray=\"{{ l.da }}\"><\u002Fline><line x1=\"{{ l.x1 }}\" y1=\"{{ l.y1 }}\" x2=\"{{ l.x2 }}\" y2=\"{{ l.y2 }}\" stroke=\"#ECECEC\" sc-camel-stroke-width=\"{{ l.gap }}\"><\u002Fline><\u002Fg><\u002Fsc-for>\n          <\u002Fsvg>\n          <sc-for list=\"{{ nurseNodes }}\" as=\"n\" hint-placeholder-count=\"0\"><button sc-camel-on-click=\"{{ n.sel }}\" style=\"{{ n.st }}\"><span style=\"{{ n.lSt }}\">{{ n.label }}<\u002Fspan><span style=\"{{ n.sSt }}\">{{ n.sub }}<\u002Fspan><\u002Fbutton><\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:absolute;left:22px;bottom:18px;display:flex;gap:18px;background:rgba(251,250,247,0.92);border:1px solid #D9D9D9;border-radius:4px;padding:9px 13px\">\n        <div style=\"display:flex;align-items:center;gap:8px;font-family:'Lato',sans-serif;font-size:10px;letter-spacing:0.08em\"><span style=\"width:26px;height:6px;border-top:2px solid #3A7F8A;border-bottom:2px solid #3A7 / Save PDF<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n    <div style=\"width:100%;max-width:1100px;background:#fff;box-shadow:0 2px 20px rgba(0,0,0,0.06);padding:44px 48px 40px;display:flex;flex-direction:column;gap:26px;box-sizing:border-box\">\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #000000;padding-bottom:18px;gap:20px\">\n        <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'Lato',sans-serif;font-size:10px;letter-spacing:0.14em;color:#7A7C7B\">LEARNING SPACE CONFIGURATOR · PLANNING WORKSHOP SUMMARY<\u002Fspan><span style=\"font-size:30px;font-weight:600;letter-spacing:-0.02em;line-height:1.1\">{{ name }}<\u002Fspan><span style=\"font-size:14px;color:#4D4D4D\">{{ type.name }} · {{ disp.arrName }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-family:'Lato',sans-serif;font-size:10.5px;color:#4D4D4D;letter-spacing:0.06em\"><span>{{ today }}<\u002Fspan><span>CONCEPTUAL PLANNING ESTIMATE<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.35fr 1fr;gap:14px\">\n        <div style=\"height:360px;background:#F7F7F7\"><dc-import name=\"RoomScene\" style=\"display:block;width:100%;height:100%\" scene=\"{{ disp }}\" view=\"3d\" annotate=\"{{ true }}\" animate=\"{{ false }}\" hint-size=\"100%,360px\"><\u002Fdc-import><\u002Fdiv>\n        <div style=\"height:360px;background:#fff;border:1px solid #E8E8E8\"><dc-import name=\"RoomScene\" style=\"display:block;width:100%;height:100%\" scene=\"{{ disp }}\" view=\"plan\" animate=\"{{ false }}\" hint-size=\"100%,360px\"><\u002Fdc-import><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid #E8E8E8;border-bottom:1px solid #E8E8E8\">\n        <sc-for list=\"{{ metrics }}\" as=\"m\" hint-placeholder-count=\"6\"><div style=\"padding:12px 0;display:flex;flex-direction:column;gap:3px\"><span style=\"font-family:'Lato',sans-serif;font-size:9px;letter-spacing:0.12em;color:#7A7C7B\">{{ m.k }}<\u002Fspan><span style=\"font-size:18px;font-weight:600\">{{ m.v }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px\">\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:9.5px;letter-spacing:0.12em;font-weight:700;color:#3A7F8A\">LEARNING INTENT<\u002Fspan><span style=\"font-size:13px;line-height:1.5\">{{ ex.learning }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:9.5px;letter-spacing:0.12em;font-weight:700;color:#3A7F8A\">ROOM STRATEGY<\u002Fspan><span style=\"font-size:13px;line-height:1.5\">{{ ex.room }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:9.5px;letter-spacing:0.12em;font-weight:700;color:#3A7F8A\">FLEXIBILITY<\u002Fspan><span style=\"font-size:13px;line-height:1.5\">{{ ex.flex }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px\">\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:9.5px;letter-spacing:0.12em;font-weight:700;color:#3A7F8A\">LEARNING MODES SUPPORTED<\u002Fspan><sc-for list=\"{{ ex.modes }}\" as=\"m\" hint-placeholder-count=\"4\"><div style=\"display:flex;justify-content:space-between;gap:8px;font-size:12.5px;border-bottom:1px solid #EFEFEF;padding:2px 0\"><span>{{ m.name }}<\u002Fspan><span style=\"{{ m.st }}\">{{ m.status }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:'Lato',sans-serif;font-size:9.5px;letter-spacing:0.12em;color:#3A7F8A\">FURNITURE STRATEGY<\u002Fspan><span style=\"font-size:13px;line-height:1.5\">{{ ex.furniture }}<\u002Fspan><\u hint-placeholder-count=\"3\"><div style=\"display:grid;grid-template-columns:20px 1fr;font-size:13px\"><span style=\"font-family:'Lato',sans-serif;font-size:10.5px;color:#3A7F8A\">{{ p.i }}<\u002Fspan><span>{{ p.t }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'Lato',sans-serif;font-size:9.5px;letter-spacing:0.12em;color:#CC1B2D\">KEY TRADE-OFFS<\u002Fspan><sc-for list=\"{{ ex.tradeoffs }}\" as=\"t\" hint-placeholder-count=\"2\"><div style=\"font-size:12.5px;line-height:1.5\">{{ t }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'Lato',sans-serif;font-size:9.5px;letter-spacing:0.12em;color:#7A7C7B\">QUESTIONS REMAINING<\u002Fspan><sc-for list=\"{{ ex.questions }}\" as=\"q\" hint-placeholder-count=\"3\"><div style=\"font-size:12.5px;line-height:1.5;display:grid;grid-template-columns:14px 1fr\"><span style=\"color:#7A7C7B\">○<\u002Fspan><span>{{ q }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;border-top:1px solid #E8E8E8;padding-top:12px;font-size:10.5px;color:#7A7C7B\"><span>Learning goals drive space decisions. Values are conceptual planning estimates, not codes or standards.<\u002Fspan><span style=\"display:flex;align-items:center;gap:8px;font-family:'Lato',sans-serif;letter-spacing:0.08em\"><img src=\"675d3991-181c-45ea-9c02-eb5ea93bba76\" alt=\"BSA\" style=\"height:11px;width:auto;display:block\">LEARNING PLANNING PLATFORM<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  C = { ink: '#000000', ink2: '#4D4D4D', ink3: '#7A7C7B', line: '#D9D9D9', line2: '#E8E8E8', teal: '#3A7F8A', tealSoft: '#DDEFF2', ochre: '#2F496E', red: '#CC1B2D', paper: '#F2F2F2', panel: '#FFFFFF' };\n  TR_MODES = ['presentation', 'smallgroup', 'discussion', 'workshop'];\n  FLEX_MODES = ['presentation', 'tbl', 'discussion', 'workshop'];\n  FLEX_NAMES = ['Presentation', 'Team Learning', 'Discussion', 'Workshop'];\n  state = { ready: false, screen: 'start', stage: 'on', cfg: null, name: '40-Student Active Learning Classroom', nameEdited: false, view: '3d', topic: 'type', touched: {}, checks: {}, rightTab: 'guide', annotate: true, wiOpen: false, wi: null, prevCfg: null, tr: null, to: null, fac: null, tip: null, tipsShown: {}, libSel: 'active', cmp: { types: ['traditional', 'flexible', 'active'], n: 40 }, prio: [40, 75, 85, 55, 80, 70], slots: {}, saveMenu: false, nurse: null, nSel: 'sim', startStep: 0, hist: [], wcIdx: -1, wcOpen: false, hl: null, hlKey: 0, hlFrom: 0, level: 'beg', coachMore: false, thinkOpen: false, refOpen: false, checkOpen: false, why: null, decs: [], decDraft: '', decNote: '', decStatus: 'AGREED', testOn: false, testSel: null, flexIdx: 0, learn: { step: 0, ans: {} }, wiBase: null };\n  TOPIC_KEY = { type: 'typeId', n: 'n', mode: 'mode', furn: 'furn', flex: 'flex', collab: 'collab', instr: 'instr', tech: 'tech', area: 'area', prop: 'prop' };\n  record(prevCfg, cfg, key, s) {\n    const L = window.LSC;\n    if (!key || JSON.stringify(prevCfg) === JSON.stringify(cfg)) return {};\n    const hist = s.hist.slice();\n    const last = hist[hist.length - 1];\n    const now = Date.now();\n    let from = prevCfg;\n    if (last && last.key === key && now - last.t < 2000) { from = last.prevCfg; hist.pop(); }\n    const a = this.build(from), b = this.build(cfg);\n    const wc = L.whatChanged(key, a, b);\n    if (wc.prev === wc.cur && !wc.facts.length) return {};\n    hist.push({ key, prevCfg: from, cfg, wc, t: now });\n    while (hist.length > 6) hist.shift();\n    clearTimeout(this.wcT); this.wcT = setTimeout(() => this.setState({ wcOpen: false }), 9000);\n    return { hist, wcIdx: hist.length - 1, wcOpen: true, hl: wc.hl, hlKey: s.hlKey + 1, hlFrom: key e.decs })); } catch (e) {}\n    }\n  }\n  build(cfg) {\n    const k = JSON.stringify(cfg);\n    this._bc = this._bc || {};\n    if (!this._bc[k]) { if (Object.keys(this._bc).length > 120) this._bc = {}; const s = window.LSC.build(cfg); s.areaFmt = window.LSC.fmtNum(s.area); s.nsfFmt = String(Math.round(s.nsf)); s.dims = window.LSC.fmtFt(s.W) + ' × ' + window.LSC.fmtFt(s.D); this._bc[k] = s; }\n    return this._bc[k];\n  }\n  autoName(cfg) { return cfg.n + '-Student ' + window.LSC.TYPE[cfg.typeId].name; }\n  set(patch, topic) {\n    clearInterval(this.trTimer);\n    this.setState((s) => {\n      const cfg = Object.assign({}, s.cfg, patch);\n      const touched = Object.assign({}, s.touched); if (topic) touched[topic] = true;\n      return Object.assign({ cfg, touched, topic: topic || s.topic, name: s.nameEdited ? s.name : this.autoName(cfg), tr: null, to: null, wi: null, testSel: null }, this.record(s.cfg, cfg, this.TOPIC_KEY[topic], s));\n    }, () => this.maybeTip(topic));\n  }\n  maybeTip(topic) {\n    if (this.state.stage !== 'off' || !topic) return;\n    const c = this.state.cfg, t = this.state.touched;\n    let id = null;\n    if (topic === 'furn' && !t.mode) id = 'furnFirst';\n    else if (topic === 'n') id = 'seats';\n    else if (topic === 'tech' && c.tech >= 2) id = 'tech';\n    else if (topic === 'flex' && c.flex >= 70) id = 'configs';\n    else if (topic === 'mode') id = 'session';\n    else if (topic === 'collab' && c.collab >= 70) id = 'bags';\n    if (!id || this.state.tipsShown[id]) return;\n    this.setState((s) => ({ tip: { id, text: window.LSC.TIPS[id] }, tipsShown: Object.assign({}, s.tipsShown, { [id]: 1 }) }));\n    clearTimeout(this.tipTimer); this.tipTimer = setTimeout(() => this.setState({ tip: null }), 11000);\n  }\n  setType(id) {\n    const L = window.LSC;\n    const cfg = L.defaultConfig(id);\n    clearInterval(this.trTimer);\n    this.setState((s) => Object.assign({ cfg, screen: 'config', topic: 'type', touched: Object.assign({}, s.touched, { type: true }), name: s.nameEdited ? s.name : this.autoName(cfg), tr: null, to: null, wi: null, fac: null, testSel: null }, this.record(s.cfg, cfg, 'typeId', s)));\n  }\n  startTransform() {\n    const sc = this.build(this.state.cfg);\n    clearInterval(this.trTimer);\n    this.setState((s) => ({ tr: { step: 0, area: sc.area, base: s.cfg }, to: null, wiOpen: false, touched: Object.assign({}, s.touched, { alt: true }), view: s.view === 'plan' ? 'plan' : '3d' }));\n    this.trTimer = setInterval(() => { const tr = this.state.tr; if (!tr || tr.step >= 3) { clearInterval(this.trTimer); return; } this.setState({ tr: Object.assign({}, tr, { step: tr.step + 1 }) }); }, 3800);\n  }\n  trScenes() {\n    const tr = this.state.tr; if (!tr) return null;\n    return this.TR_MODES.map((m) => this.build(Object.assign({}, tr.base, { mode: m, areaMode: 'fixed', area: tr.area })));\n  }\n  series(cfg, area) {\n    const k = JSON.stringify(cfg) + area;\n    if (this._serK !== k) { this._ser = window.LSC.tradeoffSeries(cfg, area); this._serK = k; }\n    return this._ser;\n  }\n  runWhatIf(id) {\n    const L = window.LSC;\n    const baseCfg = this.state.wi ? this.state.prevCfg : this.state.cfg;\n    const before = this.build(baseCfg);\n    const r = L.whatIf2(id, baseCfg, before);\n    const after = this.build(r.config);\n    const sum = L.whatIfSummary2(id, before, after);\n    clearInterval(this.trTimer);\n    this.setState((s) => ({ prevCfg: s.wi ? s.prevCfg : s.cfg, cfg: r.config, wi: { id, q: L.WHATIF2.find((w) => w.id === id).q, sum }, wiOpen: false, hl: r.hl || null, hlKey: s.hlKey + 1, hlFrom: before.seats, testSel: null, view: r.view || s.view, tr: null, to: null, topic: id === 'enroll' ? 'n' : id === 'area' ? 'area' : id === 'hybrid' ? 'tech' : id === 'collab' ? 'collab' : 'flex', name: s.nameEdited ? s.name : this.autoName(r.config), touched: Object.assign({}, s.touched, id === 'four' ? { alt: true } : {}) }));\n  }\n  facAnswer(o) {\n    const L = window.LSC;\n    const v = o.v, st = this.state, t = L.TYPE[st.cfg.typeId];\n    let cfg = Object.assign({}, st.cfg);\n    if (v.typeId) cfg = Object.assign(L.defaultConfig(v.typeId), { n: v.n });\n    else if (v.lean) {\n      const opts = t.furnitureTypes.slice().sort((a, b) => L.FURN[a].nsf - L.FURN[b].nsf);\n      if (v.lean === 'cap') Object.assign(cfg, { flex: 15, furn: opts[0] });\n      else if (v.lean === 'bal') Object.assign(cfg, { flex: 50 });\n      else Object.assign(cfg, { flex: 90, furn: ['casters', 'mixed', 'mobile', 'team'].find((f) => opts.includes(f)) || cfg.furn });\n    } else {\n      Object.assign(cfg, v);\n      if (v.n && (v.n < t.capacityMin * 0.6 || v.n > t.capacityMax * 1.3)) { const alt = v.n >= 100 ? 'lecture' : v.n >= 55 ? 'flatlecture' : v.n <= 24 ? 'flexible' : 'active'; cfg = Object.assign(L.defaultConfig(alt), { n: v.n }); }\n    }\n    const keys = ['n', 'mode', 'flex', 'instr', 'tech', 'flex'];\n    const step = st.fac.step;\n    this.setState((s) => ({ cfg, fac: { step: step + 1 }, topic: keys[step] || s.topic, touched: Object.assign({}, s.touched, { [keys[step]]: true }), name: s.nameEdited ? s.name : this.autoName(cfg) }));\n  }\n  saveSlot(id) {\n    const sc = this.build(this.state.cfg);\n    const qs = window.LSC.questionsRemaining(sc, this._items || [], []);\n    const slots = Object.assign({}, this.state.slots, { [id]: { cfg: this.state.cfg, name: this.state.name, decs: this.state.decs, questions: qs } });\n    try { localStorage.setItem('lsc-slots-v1', JSON.stringify(slots)); } catch (e) {}\n    this.setState({ slots, saveMenu: false });\n  }\n  writeSlots(slots) { try { localStorage.setItem('lsc-slots-v1', JSON.stringify(slots)); } catch (e) {} this.setState({ slots }); }\n\n  segSt(on, extra) { const C = this.C; return Object.assign({ flex: 1, padding: '6px 4px', fontSize: 11.5, border: 'none', borderRadius: 3, background: on ? '#fff' : 'transparent', color: on ? C.ink : C.ink2, boxShadow: on ? '0 1px 2px rgba(0,0,0,0.08)' : 'none', cursor:
